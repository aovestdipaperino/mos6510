<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="t d">
  <title id="t">mos6510</title>
  <desc id="d">A cheerful 40-pin DIP chip labelled 6510, winking, on a retro blue screen.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/>
      <stop offset="1" stop-color="#1f2229"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9edf2"/>
      <stop offset="0.5" stop-color="#b8bfca"/>
      <stop offset="1" stop-color="#8d95a3"/>
    </linearGradient>
    <g id="pinTop"><rect x="-4" y="0" width="8" height="18" rx="1.5" fill="url(#pin)"/></g>
  </defs>

  <!-- the screen -->
  <rect x="4" y="4" width="632" height="312" rx="28" fill="#40318d"/>
  <rect x="18" y="18" width="604" height="284" rx="18" fill="#352879"/>

  <!-- pins: 20 a side, 2.54 mm pitch scaled -->
  <g transform="translate(0,62)">
    <use href="#pinTop" x="133"/><use href="#pinTop" x="152"/><use href="#pinTop" x="171"/><use href="#pinTop" x="190"/><use href="#pinTop" x="209"/>
    <use href="#pinTop" x="228"/><use href="#pinTop" x="247"/><use href="#pinTop" x="266"/><use href="#pinTop" x="285"/><use href="#pinTop" x="304"/>
    <use href="#pinTop" x="323"/><use href="#pinTop" x="342"/><use href="#pinTop" x="361"/><use href="#pinTop" x="380"/><use href="#pinTop" x="399"/>
    <use href="#pinTop" x="418"/><use href="#pinTop" x="437"/><use href="#pinTop" x="456"/><use href="#pinTop" x="475"/><use href="#pinTop" x="494"/>
  </g>
  <g transform="translate(0,198)">
    <use href="#pinTop" x="133"/><use href="#pinTop" x="152"/><use href="#pinTop" x="171"/><use href="#pinTop" x="190"/><use href="#pinTop" x="209"/>
    <use href="#pinTop" x="228"/><use href="#pinTop" x="247"/><use href="#pinTop" x="266"/><use href="#pinTop" x="285"/><use href="#pinTop" x="304"/>
    <use href="#pinTop" x="323"/><use href="#pinTop" x="342"/><use href="#pinTop" x="361"/><use href="#pinTop" x="380"/><use href="#pinTop" x="399"/>
    <use href="#pinTop" x="418"/><use href="#pinTop" x="437"/><use href="#pinTop" x="456"/><use href="#pinTop" x="475"/><use href="#pinTop" x="494"/>
  </g>

  <!-- chip body -->
  <rect x="116" y="76" width="396" height="128" rx="10" fill="url(#body)" stroke="#0f1115" stroke-width="3"/>
  <!-- notch and pin-1 dot -->
  <path d="M116 122 a18 18 0 0 1 0 36" fill="#352879" stroke="#0f1115" stroke-width="3"/>
  <circle cx="142" cy="186" r="5" fill="#5a6070"/>

  <!-- face: one open eye, one wink -->
  <ellipse cx="262" cy="122" rx="15" ry="18" fill="#f4f6fa"/>
  <circle cx="266" cy="126" r="7" fill="#1a1d23"/>
  <circle cx="269" cy="122" r="2.4" fill="#ffffff"/>
  <path d="M352 124 q15 -13 30 0" fill="none" stroke="#f4f6fa" stroke-width="6" stroke-linecap="round"/>
  <path d="M290 150 q24 22 48 0" fill="none" stroke="#f4f6fa" stroke-width="6" stroke-linecap="round"/>
  <!-- cheeks in the C64 light red -->
  <ellipse cx="238" cy="152" rx="11" ry="6" fill="#9a6759" opacity="0.85"/>
  <ellipse cx="398" cy="152" rx="11" ry="6" fill="#9a6759" opacity="0.85"/>

  <!-- part number -->
  <text x="470" y="194" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#8e95a3" letter-spacing="2">6510</text>

  <!-- Phi-2 clock tick badge -->
  <g transform="translate(540,64)">
    <circle r="30" fill="#f26b1d" stroke="#0f1115" stroke-width="3"/>
    <text y="10" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="30" font-style="italic" font-weight="700" fill="#1a1d23">Φ2</text>
  </g>

  <!-- wordmark with a blinking-cursor block -->
  <text x="222" y="276" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="40" font-weight="700" fill="#7869c4" letter-spacing="3">mos6510</text>
  <rect x="420" y="246" width="22" height="34" fill="#7869c4"><animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/></rect>
</svg>
